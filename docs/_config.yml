# Jekyll 配置:rss-reader GitHub Pages 站点(Chirpy 主题)
# 站点根为 docs/,每日简报输出到 docs/_posts/YYYY-MM-DD.md
# Chirpy 需 GitHub Actions 构建(不在 Pages 白名单),见 .github/workflows/pages-deploy.yml

title: rss-reader
description: >-
  个人信息聚合 + AI 总结系统每日简报。抓取 RSS 源(含自建源 auto-trend、视频源),
  经两段式 pipeline(分类+打分+摘要 / 选取+去重)产出中文每日简报。
tagline: 每日 RSS 摘要日报
url: "https://int2t05.github.io"
baseurl: "/rss-reader"
lang: zh-CN
timezone: Asia/Shanghai

# 头像(GitHub avatar,消除左侧空白头像)
avatar: "https://avatars.githubusercontent.com/u/162337178?v=4"

# 头像点击跳转 GitHub 主页(Chirpy: social.links 列表,第一项用于 avatar 链接)
social:
  name: int2t05
  email:
  links:
    - https://github.com/int2t05

# 文章页 TOC 大纲(右侧 panel 显示 h2/h3 大纲)
toc: true

# Chirpy 主题(gem 形式,需 Actions 构建)
theme: jekyll-theme-chirpy

# 文章 permalink:按日期 + slug
permalink: /posts/:year/:month/:day/:title/

# Markdown 渲染
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# 分页
paginate: 10
paginate_path: "/page:num/"

# Chirpy tabs collection(导航入口:_tabs/*.md 生成 /tabs/{name}/)
collections:
  tabs:
    output: true
    sort_by: order

# Chirpy 用 jekyll-archives 自动生成分类/标签/归档页(gem 自带 jekyll-feed)
jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/

# 默认 front matter:每篇 post 的 layout 默认为 post
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: rss-reader

# 排除非站点文件(架构文档等)不参与构建
exclude:
  - API/
  - FLOW/
  - PRD.md
  - TECH.md
  - TODO.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
