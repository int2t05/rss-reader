<!-- 头像点击跳转 GitHub 主页:Chirpy sidebar avatar 默认指向首页,JS 覆盖 href -->
<script>
(function() {
  function setAvatarLink() {
    var a = document.getElementById('avatar');
    if (a) { a.href = 'https://github.com/int2t05'; }
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setAvatarLink);
  } else {
    setAvatarLink();
  }
  // 侧边栏若被主题 JS 重渲染,MutationObserver 兜底再改一次
  new MutationObserver(setAvatarLink).observe(document.documentElement, { childList: true, subtree: true });
})();
</script>
