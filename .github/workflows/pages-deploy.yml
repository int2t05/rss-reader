name: "Build and Deploy Pages"

# Chirpy 主题不在 GitHub Pages 白名单,需 Actions 构建。
# 触发:① docs/** 变更 push;② Daily Briefing workflow 完成后(GITHUB_TOKEN 的
# push 不触发其他 workflow,需 workflow_run 显式监听,否则日报不重建站点)。
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Briefing"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main  # workflow_run 触发时取最新 main(含 daily 刚提交的日报)

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs

      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
