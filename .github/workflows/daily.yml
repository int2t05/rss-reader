name: Daily Briefing

# 每日 UTC 00:17 消费 RSS 消息队列,产出中文简报并提交到 docs/_posts/。
# 推送后由 pages-deploy.yml 的 workflow_run 监听重建 Chirpy 站点。
# 亦可手动触发。
on:
  schedule:
    - cron: "17 0 * * *"  # UTC 00:17 每日
  workflow_dispatch:

# 单一并发,避免并发跑覆盖 Pages 提交
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    # Tier1 并发 10 分类 ~1300 条,LLM 慢响应或重试时单轮可达 40+ 分钟;
    # 不在超时上限制,确保简报产出不被砍(9-22/9-23 即由 30 分钟超时取消)。
    timeout-minutes: 90
    permissions:
      contents: write  # 用于提交 docs/_posts 与 data/summaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run daily pipeline
        env:
          PYTHONUNBUFFERED: "1"  # 强制无缓冲,CI 管道下进度/日志立即可见
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
          FLUXSIFT_FEED_URL: ${{ secrets.FLUXSIFT_FEED_URL }}
        run: |
          uv run rss-reader --log-level INFO

      - name: Commit and push briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_posts/ data/dedup.db || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(daily): $(date -u +%Y-%m-%d) briefing"
            # 运行期间可能有新 push,rebase 后再推,避免 fast-forward 拒绝
            git pull --rebase origin main
            git push
          fi
