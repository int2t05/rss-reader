name: Daily Briefing

# 每日 UTC 00:17 跑完整 pipeline,产出中文简报并发布到 GitHub Pages。
# 亦可手动触发(支持传入指定日期)。
on:
  schedule:
    - cron: "17 0 * * *"  # UTC 00:17 每日
  workflow_dispatch:
    inputs:
      hours:
        description: "Fetch window in hours (default 24)"
        required: false
        default: "24"

# 单一并发,避免并发跑覆盖 Pages 提交
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # 用于提交 docs/_posts 与 data/summaries
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run daily pipeline
        env:
          PYTHONUNBUFFERED: "1"  # 强制无缓冲,CI 管道下进度/日志立即可见
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          RSSHUB_BASE_URL: ${{ secrets.RSSHUB_BASE_URL }}
        run: |
          uv run rss-reader --hours ${{ github.event.inputs.hours || '24' }} --log-level INFO

      - name: Commit and push briefing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_posts/ data/summaries/ || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs(daily): $(date -u +%Y-%m-%d) briefing"
            git push
          fi
