name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and JavaScript checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --extra dev

      - name: Run Ruff
        run: uv run ruff check .

      - name: Run offline tests
        run: uv run pytest -m "not network and not llm"

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22

      - name: Check browser scripts
        run: for file in docs/assets/js/*.js; do node --check "$file"; done

  site-build:
    name: Build GitHub Pages site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: docs
        env:
          BUNDLE_FROZEN: "true"

      - name: Build site
        working-directory: docs
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
